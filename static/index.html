<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoom Clone - Kirish</title>
    <link rel="stylesheet" href="/public/name_page.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>

<body>
    <div class="Name-Page">
        <div class="form">
            <form class="known-form" action="/join" method="GET">
                <input type="text" placeholder="Ismingizni kiriting" name="name" required />
                <button type="submit">Meeting Boshlash</button>
                <p><a href="javascript:show()">Meetingga Qo‘shilish</a></p>
            </form>
            <form class="unknown-form" action="/joinold" method="GET">
                <input type="text" placeholder="Ismingizni kiriting" name="name" required />
                <input type="text" placeholder="Meeting ID kiriting" name="meeting_id" required />
                <button type="submit">Meetingga Qo‘shilish</button>
                <p><a href="javascript:show()">Meeting Boshlash</a></p>
            </form>
        </div>
    </div>
    <script>
        function show() {
            $('form').animate({ height: "toggle", opacity: "toggle" }, "slow");
        }
    </script>
</body>

</html>
